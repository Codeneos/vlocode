id: omnistudio-managed
label: OmniStudio Managed
description: OmniStudio/Vlocity Managed package
definitions:
  OmniScript: &managedOmniScriptBase
    objectType: '%vlocity_namespace%__OmniScript__c'
    name:
      - '%vlocity_namespace%__Type__c'
      - '%vlocity_namespace%__SubType__c'
      - '%vlocity_namespace%__Language__c'
    exportKey:
      - "%vlocity_namespace%__Type__c"
      - "%vlocity_namespace%__SubType__c"
      - "%vlocity_namespace%__Language__c"
    nullValues: omit
    parseJson: false
    matchingKeyFields:
      - '%vlocity_namespace%__Type__c'
      - '%vlocity_namespace%__SubType__c'
      - '%vlocity_namespace%__Language__c'
      - '%vlocity_namespace%__Version__c'
    filter:
      '%vlocity_namespace%__IsProcedure__c': false
    ignoreFields:
      - '%vlocity_namespace%__IsActive__c'
      - '%vlocity_namespace%__Version__c'
      - '%vlocity_namespace%__LwcId__c'
    fields: &managedScriptFields
      '%vlocity_namespace%__CustomJavaScript__c':
        fileName:
          - _JavaScript.js
      '%vlocity_namespace%__PropertySet__c':
        parseJson: true
        fileName:
          - _PropertySet
      '%vlocity_namespace%__TestHTMLTemplates__c':
        fileName:
          - _HTMLTemplates.html
    embeddedObjects:
      '%vlocity_namespace%__Element__c':
        objectType: '%vlocity_namespace%__Element__c'
        filter:
          '%vlocity_namespace%__OmniScriptId__c': '{%vlocity_namespace%__OmniScript__c:Id}'
        limit: 5000
        fileName:
          - _Element
          - Name
        expandArray: true
        sortParentField: '%vlocity_namespace%__ParentElementId__c'
        sortFields:
          - '%vlocity_namespace%__Order__c'

  IntegrationProcedure:
    <<: *managedOmniScriptBase
    name:
      - '%vlocity_namespace%__Type__c'
      - '%vlocity_namespace%__SubType__c'
    filter:
      '%vlocity_namespace%__IsProcedure__c': true
    fields:
      <<: *managedScriptFields
      '%vlocity_namespace%__CustomJavaScript__c':
        parseJson: true
        fileName:
          - _SampleInput

  DataRaptor: &managedDataRaptor
    objectType: '%vlocity_namespace%__DRBundle__c'
    name:
      - Name
    nullValues: emptyString
    parseJson: false
    matchingKeyFields:
      - Name
    ignoreFields:
      - '%vlocity_namespace%__FormulaConverted__c'
    fields:
      '%vlocity_namespace%__InputJson__c':
        parseJson: true
        fileName:
          - _InputJson
      '%vlocity_namespace%__SampleInputJSON__c':
        parseJson: true
        fileName:
          - _SampleInputJson
      '%vlocity_namespace%__SampleInputXML__c':
        fileName:
          - _SampleInputXML.xml
      '%vlocity_namespace%__TargetOutJson__c':
        parseJson: true
        fileName:
          - _TargetOutJson
      '%vlocity_namespace%__TargetOutXml__c':
        fileName:
          - _TargetOutXml.xml
    embeddedObjects:
      '%vlocity_namespace%__DRMapItem__c':
        objectType: '%vlocity_namespace%__DRMapItem__c'
        filter:
          Name: '{%vlocity_namespace%__DRBundle__c:Name}'
        fileName:
          - _Mappings
        sortMode: vlocity
        sortFields:
          - '%vlocity_namespace%__InterfaceObjectLookupOrder__c'
          - '%vlocity_namespace%__FilterGroup__c'
          - '%vlocity_namespace%__DomainObjectCreationOrder__c'
          - '%vlocity_namespace%__DomainObjectAPIName__c'
          - '%vlocity_namespace%__DomainObjectFieldAPIName__c'
          - '%vlocity_namespace%__InterfaceFieldAPIName__c'

  '%vlocity_namespace%__Element__c':
    dependent: true
    objectType: '%vlocity_namespace%__Element__c'
    name:
      - Name
    exportKey:
      - '%vlocity_namespace%__OmniScriptId__c'
      - Name
    matchingKeyFields:
      - '%vlocity_namespace%__OmniScriptId__c'
      - Name
    nullValues: omit
    parseJson: false
    ignoreFields:
      - '%vlocity_namespace%__Order__c'
      - '%vlocity_namespace%__OmniScriptVersion__c'
      - '%vlocity_namespace%__Level__c'
    fields:
      '%vlocity_namespace%__PropertySet__c':
        parseJson: true
        fileName:
          - _PropertySet

  '%vlocity_namespace%__DRMapItem__c':
    dependent: true
    objectType: '%vlocity_namespace%__DRMapItem__c'
    name:
      - '%vlocity_namespace%__MapId__c'
    matchingKeyFields:
      - '%vlocity_namespace%__MapId__c'
      - Name
    nullValues: omit
    parseJson: false
    ignoreFields:
      - '%vlocity_namespace%__FormulaConverted__c'
