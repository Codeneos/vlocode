id: omnistudio-standard
label: OmniStudio Standard
description: Standard runtime
definitions:
  OmniScript: &omniProcessBase
    objectType: OmniProcess
    name:
      - Type
      - SubType
      - Language
    exportKey:
      - Type
      - SubType
      - Language
    nullValues: omit
    parseJson: false
    matchingKeyFields:
      - Type
      - SubType
      - Language
      - VersionNumber
    ignoreFields:
      - IsActive
      - VersionNumber
    filter:
      IsIntegrationProcedure: false
    fields: &standardScriptFields
      CustomJavaScript:
        fileName:
          - _JavaScript.js
      PropertySetConfig:
        parseJson: true
        fileName:
          - _PropertySetConfig
      CustomHtmlTemplates:
        fileName:
          - _HTMLTemplates.html
    embeddedObjects:
      OmniProcessElement:
        objectType: OmniProcessElement
        filter:
          OmniProcessId: '{OmniProcess:Id}'
        fileName:
          - _Element
          - Name
        expandArray: true
        sortParentField: ParentElementId
        sortFields:
          - SequenceNumber

  IntegrationProcedure:
    <<: *omniProcessBase
    name:
      - Type
      - SubType
    filter:
      IsIntegrationProcedure: true
    ignoreFields:
      - IsActive
      - VersionNumber
      - WebComponentKey
    fields:
      <<: *standardScriptFields
      CustomJavaScript:
        parseJson: true
        fileName:
          - _SampleInput

  DataRaptor: &omniDataTransform
    objectType: OmniDataTransform
    name:
      - Name
    nullValues: emptyString
    parseJson: false
    matchingKeyFields:
      - Name
    ignoreFields:
      - IsActive
    fields:
      GlobalKey:
        processor: return datapack.Name;
      ExpectedInputJson:
        parseJson: true
        fileName:
          - _InputJson
      PreviewJsonData:
        parseJson: true
        fileName:
          - _SampleInputJson
      PreviewXmlData:
        fileName:
          - _SampleInputXML.xml
      ExpectedOutputJson:
        parseJson: true
        fileName:
          - _TargetOutJson
      ExpectedOutputXml:
        fileName:
          - _TargetOutXml.xml
    embeddedObjects:
      OmniDataTransformItem:
        objectType: OmniDataTransformItem
        filter:
          OmniDataTransformationId: '{OmniDataTransform:Id}'
        fileName:
          - _Items
        sortMode: vlocity
        sortFields:
          - InputObjectQuerySequence
          - FilterGroup
          - OutputCreationSequence
          - OutputObjectName
          - OutputFieldName
          - InputFieldName

  OmniProcessElement:
    dependent: true
    objectType: OmniProcessElement
    name:
      - Name
    exportKey:
      - OmniProcessId
      - Name
    matchingKeyFields:
      - OmniProcessId
      - Name
    nullValues: omit
    parseJson: false
    ignoreFields:
      - SequenceNumber
      - Level
      - OmniProcessVersionNumber
      - IsOmniScriptEmbeddable
      - ParentElementName
      - ParentElementType
    fields:
      PropertySetConfig:
        parseJson: true
        fileName:
          - _PropertySetConfig

  OmniDataTransformItem:
    dependent: true
    objectType: OmniDataTransformItem
    name:
      - GlobalKey
    nullValues: omit
    parseJson: false
    ignoreFields:
      - FormulaConverted
